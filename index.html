<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curriculum Map Builder | Waterdog Institute</title>
  <meta name="description" content="A free, open-source tool for building a curriculum map and saving it as a clean, printable PDF.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // Pick the theme before the page draws, so it doesn't flash the wrong colors.
    // Uses the saved choice, or the computer's light/dark setting on a first visit.
    (function () {
      var saved = localStorage.getItem("curriculum-map-builder:theme");
      var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
</head>
<body>

  <header class="toolbar">
    <div class="toolbar-left">
      <div class="view-toggles">
        <button type="button" class="icon-btn" id="toggle-editor" title="Hide the form" aria-label="Hide the form">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="8" y1="3.5" x2="8" y2="16.5" stroke="currentColor" stroke-width="1.6"/><rect class="fill" x="3.3" y="4.3" width="4" height="11.4" rx="1.6" fill="currentColor"/></svg>
        </button>
        <button type="button" class="icon-btn" id="toggle-preview" title="Hide the map" aria-label="Hide the map">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="12" y1="3.5" x2="12" y2="16.5" stroke="currentColor" stroke-width="1.6"/><rect class="fill" x="12.7" y="4.3" width="4" height="11.4" rx="1.6" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="toolbar-title">
        <a href="https://waterdog.institute/" class="brand">Waterdog Institute</a>
        <h1>Curriculum Map Builder</h1>
      </div>
    </div>
    <div class="toolbar-actions">
      <button class="btn btn-outline" id="theme-toggle" type="button">Dark mode</button>
      <button class="btn btn-outline" id="new-map">New map</button>
      <label class="btn btn-outline">
        Open map
        <input type="file" id="open-file" accept=".json,application/json" hidden>
      </label>
      <button class="btn btn-outline" id="save-file">Save map</button>
      <button class="btn btn-outline" id="print" type="button">Print</button>
      <button class="btn" id="download-pdf" type="button">Download PDF</button>
    </div>
  </header>

  <main class="workspace">
    <section class="editor" aria-label="Edit your map">
      <p class="hint">Fill in your course and units. The formatted map updates on the right as you type, and your work is kept in this browser. Use <strong>Save map</strong> to keep a copy you can open later.</p>
      <div id="editor"></div>
    </section>
    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="Drag to resize the form and the map" tabindex="0"></div>
    <section class="preview" aria-label="Preview">
      <article id="map" class="map"></article>
    </section>
  </main>

  <script src="app.js"></script>
  <script src="pdf.js"></script>
</body>
</html>
