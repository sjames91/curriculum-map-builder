<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curriculum Map Builder | Waterdog Institute</title>
  <meta name="description" content="A free, open-source tool for building a curriculum map and saving it as a clean, printable PDF.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // Pick the theme before the page draws, so it doesn't flash the wrong colors.
    // Uses the saved choice, or the computer's light/dark setting on a first visit.
    (function () {
      var saved = localStorage.getItem("curriculum-map-builder:theme");
      var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
</head>
<body>

  <header class="toolbar">
    <div class="toolbar-title">
      <a href="https://waterdog.institute/" class="brand">Waterdog Institute</a>
      <h1>Curriculum Map Builder</h1>
    </div>
    <div class="toolbar-actions">
      <button class="btn btn-outline" id="theme-toggle" type="button">Dark mode</button>
      <button class="btn btn-outline" id="new-map">New map</button>
      <label class="btn btn-outline">
        Open map
        <input type="file" id="open-file" accept=".json,application/json" hidden>
      </label>
      <button class="btn btn-outline" id="save-file">Save map</button>
      <button class="btn btn-outline" id="print" type="button">Print</button>
      <button class="btn" id="download-pdf" type="button">Download PDF</button>
    </div>
  </header>

  <main class="workspace">
    <section class="editor" aria-label="Edit your map">
      <p class="hint">Fill in your course and units. The formatted map updates on the right as you type, and your work is kept in this browser. Use <strong>Save map</strong> to keep a copy you can open later.</p>
      <div id="editor"></div>
    </section>
    <section class="preview" aria-label="Preview">
      <article id="map" class="map"></article>
    </section>
  </main>

  <script src="app.js"></script>
  <script src="pdf.js"></script>
</body>
</html>
